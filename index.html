<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Shooter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="game-shell">
        <header class="hud">
            <div class="hud-item">Skor: <span id="score">0</span></div>
            <div class="hud-item">Nyawa: <span id="lives">3</span></div>
        </header>
        <section id="gameArea" class="game-area">
            <div id="player" class="player"></div>
            <div id="message" class="message hidden">Tekan Spasi untuk mulai</div>
            <div id="pauseOverlay" class="pause-overlay hidden">
                <div class="pause-content">
                    <h2>PAUSE</h2>
                    <p>Tekan P atau ESC untuk melanjutkan</p>
                </div>
            </div>
        </section>
        <footer class="controls">
            Gerakkan mouse untuk memindahkan pesawat, tekan Spasi untuk menembak, tekan P atau ESC untuk pause.
        </footer>
    </main>
    <audio id="shootSound" src="shoot.m4a" preload="auto"></audio>
    <audio id="explosionSound" src="ledakan.m4a" preload="auto"></audio>
    <audio id="bgm" src="backgroundsuara.m4a" preload="auto" loop></audio>
    <script src="script.js"></script>
</body>
</html>
